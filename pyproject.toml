[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "discretization"
version = "0.1.0"
description = "Tools to help discretizing with high accuracy a floating point problem."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-benchmark>=5.1",
    "pandas>=2",
]
dev = [
    "discretization[test]",
    "ruff>=0.6",
    "clang-format==23.1.3",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/src/discretization"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests_py"]
python_files = ["test_*.py"]
addopts = [
    "-vv",
    "--maxfail=10",
    "--timeout=60",
    "--cov=discretization",
    "--cov-report=term",
    "--cov-report=html:build/coverage",
    "--benchmark-columns=min,mean,max,rounds",
]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["tmp"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, and import sorting.
select = ["E", "F", "I"]
# Long lines are left to the formatter (it does not rewrap comments/docstrings).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["discretization", "tests_py"]
